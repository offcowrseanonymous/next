name: Build Next IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura) para dispositivo iOS
        run: |
          xcodebuild -project Next.xcodeproj \
            -scheme Next \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Empacotar em .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Next.app Payload/
          zip -r Next.ipa Payload

      - name: Publicar o .ipa como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Next-ipa
          path: Next.ipa
